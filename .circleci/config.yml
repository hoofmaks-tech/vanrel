version: 2.1

jobs:
  check-and-test:
    docker:
      - image: cimg/node:lts
    resource_class: small
    steps:
      - checkout
      - run:
          name: Versions
          command: node -v && npm -v
      - run:
          name: Install dependencies
          command: npm ci --legacy-peer-deps
      - run:
          name: Static checks (tsc + biome + import graph)
          command: npm run check
      - run:
          name: Build workspaces (cli tests consume built dist)
          command: npm run build
      - run:
          name: Tests
          command: npm test

workflows:
  ci:
    jobs:
      - check-and-test
